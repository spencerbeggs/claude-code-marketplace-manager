name: Silk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, changeset-release/main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run in dry-run mode
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow
    # Pinned to a commit SHA (zizmor unpinned-uses) rather than the mutable
    # @main ref — bump deliberately when spencerbeggs/.github changes.
    uses: spencerbeggs/.github/.github/workflows/release.yml@c7bfce7146b9eda8a90df6c63c8a21b555ad6c42
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
      attestations: write
      checks: write
      artifact-metadata: write
    with:
      dry-run: ${{ inputs.dry_run || false }}
      app-bot-id: ${{ vars.APP_BOT_ID }}
      app-bot-name: ${{ vars.APP_BOT_NAME }}
      skip-claude-review: false
    # Explicit secrets (zizmor secrets-inherit) — only what the reusable
    # workflow's `secrets:` block declares, by name.
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_REVIEW_PAT: ${{ secrets.CLAUDE_REVIEW_PAT }}
      CUSTOM_REGISTRIES: ${{ secrets.CUSTOM_REGISTRIES }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
